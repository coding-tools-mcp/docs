name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /docs
      NEXT_PUBLIC_SITE_URL: https://example.test/docs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
